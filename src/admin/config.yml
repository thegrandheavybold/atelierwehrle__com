backend:
  name: github
  repo: thegrandheavybold/atelierwehrle__com
  branch: main
  
publish_mode: editorial_workflow

media_folder: "/src/assets/img"
public_folder: "/assets/img"

i18n:
  structure: multiple_folders
  locales: [de, en]
  default_locale: de 

collections:
  - label: "Gärten"
    name: "gaerten"
    folder: "src/gaerten"
    slug: "{{urlSlug}}"   
    path: "{{slug}}"  
    create: true
    i18n: true
    extension: "md"
    format: "frontmatter"
    fields:

      - { label: "Title", name: "title", widget: "string", i18n: true }

      - label: "Datum"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm"
        picker_utc: false
        required: true
        default: ""
        i18n: true

      - label: "URL Slug"
        name: "urlSlug"
        widget: "string"
        hint: "URL-Bezeichnung"
        required: true
        i18n: true
      
      - label: "SEO Meta Tags"
        name: "metaTags"
        widget: "object"
        i18n: true
        fields:
          - { label: "Meta Title", name: "metatitle", widget: "string", i18n: true, required: false }
          - { label: "Meta Description", name: "metaDescription", widget: "text", i18n: true, required: false }

      - label: "Featured"
        name: "featured"
        widget: "object"
        i18n: true  
        fields:
          - { label: "Featured Image", name: "featImage", widget: "image", i18n: true, choose_url: false, required: false, media_folder: "/src/assets/img", public_folder: "/assets/img" }
          - { label: "Alt Text", name: "alt", widget: "string", i18n: true }


      - label: "Main Article"
        name: "mainArticle"
        widget: "object"
        i18n: true
        required: false
        fields:
          - label: "Article Header"
            name: "articleHeader"
            widget: "object"
            required: false
            i18n: true
            fields:
              - { label: "Opener Image", name: "openerImage", widget: "image", i18n: true, choose_url: false, required: false, media_folder: "/src/assets/img", public_folder: "/assets/img" }
              - { label: "Alt Text", name: "alt", widget: "string", i18n: true, required: false }

          - label: "Gallery"
            name: "galleryImages"
            widget: "list"
            i18n: true
            required: false
            fields:
              - { label: "Image", name: "image", widget: "image", i18n: true, choose_url: false, required: false, media_folder: "/src/assets/img", public_folder: "/assets/img" }
              - { label: "Alt Text", name: "alt", widget: "string", required: false }

          - { label: "Article Copy", name: "copy", widget: "markdown", i18n: true, required: false }

          - label: "Article Footer"
            name: "articleFooter"
            widget: "object"
            i18n: true
            required: false
            fields:
              - { label: "Closing Image", name: "closingImage", widget: "image", i18n: true, choose_url: false, required: false, media_folder: "/src/assets/img", public_folder: "/assets/img" }
              - { label: "Alt Text", name: "alt", widget: "string", i18n: true, required: false }

          - label: "Article Credits"
            name: "articleCredits"
            widget: "object"
            i18n: true
            fields:
              - { label: "Entwurf & Ausführungsplanung", name: "entwurf", widget: "string", i18n: true, required: false }
              - { label: "Ausführung", name: "ausfuehrung", widget: "string", i18n: true, required: false }
              - { label: "Bilder", name: "bilder", widget: "string", i18n: true, required: false }

  - label: "Team"
    name: "team"
    folder: "src/team"
    slug: "{{slug}}"
    path: "{{slug}}"
    create: true
    i18n: true
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Name", name: "name", widget: "string", i18n: true }
      - { label: "Rolle / Jobtitel", name: "role", widget: "string", i18n: true, required: false }
      - { label: "Sortierung", name: "order", widget: "number", value_type: "int", min: 1, step: 1, i18n: duplicate }
      - { label: "Bild", name: "image", widget: "image", i18n: true, required: false, choose_url: false, media_folder: "/src/assets/img", public_folder: "/assets/img" }
      - { label: "Alt Text", name: "alt", widget: "string", i18n: true, required: false }
      - { label: "Platzhalter aktiv", name: "placeholder", widget: "boolean", default: false, i18n: duplicate }
      - { label: "Profiltext", name: "body", widget: "markdown", i18n: true, required: false }

  - label: "Seiten"
    name: "pages"
    i18n: true
    files:
      - label: "Atelier"
        name: "atelier"
        file: "src/pages/{{locale}}/atelier.njk"
        i18n: true
        fields:
          - { label: "Titel", name: "title", widget: "string", required: true, i18n: true }
          - { label: "SEO Title", name: "seoTitle", widget: "string", required: false, i18n: true }
          - { label: "SEO Description", name: "seoDescription", widget: "text", required: false, i18n: true }
          - { label: "Meta Image", name: "metaImage", widget: "string", required: false, i18n: duplicate }
          - { label: "Einleitungstext", name: "introCopy", widget: "markdown", required: false, i18n: true }
          - label: "Awards"
            name: "awards"
            widget: "list"
            required: false
            i18n: true
            fields:
              - { label: "Bild", name: "image", widget: "image", choose_url: false, required: true, media_folder: "/src/assets/img", public_folder: "/assets/img", i18n: duplicate }
              - { label: "Alt Text", name: "alt", widget: "string", required: true, i18n: true }
              - { label: "Link (optional)", name: "link", widget: "string", required: false, i18n: duplicate }
      - label: "Kontakt"
        name: "contact"
        file: "src/pages/{{locale}}/kontakt.njk"
        i18n: true
        fields:
          - { label: "Titel", name: "title", widget: "string", required: true, i18n: true }
          - { label: "SEO Title", name: "seoTitle", widget: "string", required: false, i18n: true }
          - { label: "SEO Description", name: "seoDescription", widget: "text", required: false, i18n: true }
          - { label: "Meta Image", name: "metaImage", widget: "string", required: false, i18n: duplicate }
          - { label: "Kontaktblock links", name: "contactPrimary", widget: "markdown", required: false, i18n: true }
          - { label: "Kontaktblock rechts", name: "contactSecondary", widget: "markdown", required: false, i18n: true }
