[build]
  command = "npm run build"
  publish = "dist"

  [build.environment]
  NODE_VERSION = "20.11.1"


[dev]
  command = "npx @11ty/eleventy --serve --watch --incremental --quiet"
  publish = "dist"
  targetPort = 8080
  port = 8888

  [dev.environment]
  CONTEXT = "dev"


[build.processing.html]
  pretty_urls = true
